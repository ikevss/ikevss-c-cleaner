<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#ffffff"/>

  <!-- 巨大的电脑屏幕 -->
  <rect x="34" y="34" width="132" height="96" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="42" y="42" width="116" height="80" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
  <!-- 屏幕支架 -->
  <path d="M 88 130 L 84 150 L 116 150 L 112 130" fill="#ffffff" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="72" y1="150" x2="128" y2="150" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>

  <!-- 屏幕内容：清理完成 -->
  <text x="100" y="68" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#1f2937">C盘释放</text>
  <text x="100" y="92" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#F97316">20 GB</text>
  <!-- 绿色对勾圆 -->
  <circle cx="100" cy="110" r="8" fill="none" stroke="#22c55e" stroke-width="2"/>
  <path d="M 96 110 L 99 113 L 105 107" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 开心的小橙：站在屏幕前，比大拇指 -->
  <!-- 头 -->
  <circle cx="62" cy="150" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <circle cx="59" cy="149" r="1.3" fill="#1f2937"/>
  <circle cx="65" cy="149" r="1.3" fill="#1f2937"/>
  <!-- 微笑嘴巴 -->
  <path d="M 59 153 Q 62 156 65 153" fill="none" stroke="#1f2937" stroke-width="1.6" stroke-linecap="round"/>
  <!-- 身体 -->
  <rect x="55" y="160" width="14" height="20" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <!-- 橙色胸点 -->
  <circle cx="62" cy="170" r="2.2" fill="#F97316"/>
  <!-- 大拇指手臂（举高） -->
  <line x1="68" y1="164" x2="78" y2="152" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <circle cx="79" cy="150" r="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
  <!-- 另一只手 -->
  <line x1="56" y1="166" x2="50" y2="176" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <!-- 腿 -->
  <line x1="59" y1="180" x2="58" y2="192" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="65" y1="180" x2="67" y2="192" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

  <!-- 开心的小星星 -->
  <path d="M 84 138 L 86 133 L 88 138 L 93 140 L 88 142 L 86 147 L 84 142 L 79 140 Z" fill="#F97316"/>
  <circle cx="140" cy="140" r="2.4" fill="#F97316"/>
  <circle cx="150" cy="132" r="2" fill="#F97316"/>
  <path d="M 132 152 L 134 148 L 136 152 L 140 154 L 136 156 L 134 160 L 132 156 L 128 154 Z" fill="#F97316"/>

  <!-- 签名 -->
  <line x1="14" y1="190" x2="24" y2="190" stroke="#F97316" stroke-width="2" stroke-linecap="round"/>
  <text x="14" y="199" font-family="sans-serif" font-size="6.5" fill="#9ca3af">清完的那一刻，真解压</text>
</svg>
