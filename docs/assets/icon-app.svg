<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ikevss C盘清理图标">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="diskShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff1e6"/>
    </linearGradient>
  </defs>

  <!-- APP 图标底板：橙色渐变圆角方块 -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <!-- 顶部受光高光 -->
  <path d="M 17 4 H 47 Q 60 4 60 17 V 20 Q 40 12 18 14 Q 8 15 4 20 V 17 Q 4 4 17 4 Z" fill="#ffffff" opacity="0.18"/>

  <!-- 磁盘盘片 -->
  <circle cx="29" cy="37" r="16.5" fill="url(#diskShine)"/>
  <!-- 盘面轨道环 -->
  <circle cx="29" cy="37" r="10.5" fill="none" stroke="#FDBA74" stroke-width="1.6"/>
  <!-- 中心主轴 -->
  <circle cx="29" cy="37" r="5.5" fill="#F97316"/>
  <circle cx="29" cy="37" r="2" fill="#ffffff"/>
  <!-- 已被扫净的高光弧（盘面左上） -->
  <path d="M 17.5 30 A 16.5 16.5 0 0 1 34 21.2" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>

  <!-- 扫帚：从右上斜扫过盘面 -->
  <!-- 帚柄 -->
  <line x1="51" y1="10" x2="40" y2="21" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round"/>
  <!-- 帚毛扇 -->
  <path d="M 40 21 L 27.5 29.5 Q 26 32.5 28.5 35.5 L 34 38.5 Q 37.5 37.5 38.5 34 Z" fill="#ffffff"/>
  <!-- 帚毛分缕 -->
  <path d="M 38 24 L 30.5 30.5" stroke="#FDBA74" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 38.5 27.5 L 32.5 33.5" stroke="#FDBA74" stroke-width="1.4" stroke-linecap="round"/>

  <!-- 扫出的洁净星光 -->
  <path d="M 15 16 L 16.6 11.5 L 18.2 16 L 22.7 17.6 L 18.2 19.2 L 16.6 23.7 L 15 19.2 L 10.5 17.6 Z" fill="#ffffff"/>
  <circle cx="9.5" cy="27" r="1.8" fill="#ffffff" opacity="0.9"/>
  <circle cx="22" cy="8.5" r="1.5" fill="#ffffff" opacity="0.8"/>
</svg>
