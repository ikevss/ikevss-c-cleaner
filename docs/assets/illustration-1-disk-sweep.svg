<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 背景：纯白 -->
  <rect width="200" height="200" fill="#ffffff"/>

  <!-- 硬盘主体（巨大，占据画面） -->
  <rect x="38" y="52" width="124" height="96" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 硬盘盘面同心圆 -->
  <circle cx="88" cy="100" r="30" fill="none" stroke="#1f2937" stroke-width="1.8"/>
  <circle cx="88" cy="100" r="19" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="88" cy="100" r="6" fill="#1f2937"/>
  <!-- 盘臂 -->
  <path d="M 148 132 Q 120 118 106 96" fill="none" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="148" cy="132" r="4.5" fill="#1f2937"/>
  <!-- 硬盘指示灯 -->
  <circle cx="152" cy="62" r="3" fill="#1f2937"/>

  <!-- 容量条：红(满)缩小 + 绿(有空)出现 -->
  <rect x="38" y="156" width="124" height="10" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/>
  <rect x="42" y="159" width="52" height="4" rx="2" fill="#ef4444"/>
  <rect x="98" y="159" width="58" height="4" rx="2" fill="#22c55e"/>

  <!-- 扫出的灰尘/星星 -->
  <path d="M 40 40 L 43 34 L 46 40 L 52 43 L 46 46 L 43 52 L 40 46 L 34 43 Z" fill="#F97316"/>
  <circle cx="70" cy="36" r="3" fill="#F97316"/>
  <circle cx="130" cy="42" r="2.4" fill="#F97316"/>
  <circle cx="104" cy="32" r="2" fill="#F97316"/>
  <circle cx="160" cy="100" r="2.4" fill="#F97316"/>
  <path d="M 150 76 L 152.4 70 L 155 76 L 161 78 L 155 80 L 152.4 86 L 150 80 L 144 78 Z" fill="#F97316"/>

  <!-- 小橙：站在右下角，举着扫帚扫地 -->
  <!-- 扫帚杆 -->
  <line x1="132" y1="130" x2="118" y2="172" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <!-- 扫帚头（橙色点缀） -->
  <path d="M 110 172 L 126 172 L 122 186 L 114 186 Z" fill="#F97316"/>
  <line x1="110" y1="172" x2="126" y2="172" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <!-- 小橙身体 -->
  <circle cx="140" cy="166" r="7" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <circle cx="138" cy="165" r="1.2" fill="#1f2937"/>
  <circle cx="143" cy="165" r="1.2" fill="#1f2937"/>
  <rect x="135" y="174" width="10" height="14" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <!-- 橙色胸点 -->
  <circle cx="140" cy="181" r="2" fill="#F97316"/>
  <!-- 手臂伸向扫帚 -->
  <line x1="136" y1="177" x2="128" y2="160" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="144" y1="177" x2="150" y2="186" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <!-- 腿 -->
  <line x1="138" y1="188" x2="137" y2="196" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="142" y1="188" x2="144" y2="196" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

  <!-- 签名 -->
  <line x1="14" y1="190" x2="24" y2="190" stroke="#F97316" stroke-width="2" stroke-linecap="round"/>
  <text x="14" y="199" font-family="sans-serif" font-size="6.5" fill="#9ca3af">C盘清一清，空间就回来</text>
</svg>
